name: Build and Push Custom Caddy Image

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if no dependency changed'
        type: boolean
        default: false

  # Check for new Caddy / plugin releases every Sunday at 18:30 UTC.
  # GitHub disables scheduled workflows after 60 days without repo activity;
  # the "Keep schedule alive" step below re-enables this workflow on every run
  # through the API, so no dummy commits are needed.
  schedule:
    - cron: '30 18 * * 0'

  push:
    branches:
      - 'main'

concurrency:
  group: build-caddy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write   # needed by the "Keep schedule alive" step

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache entries are immutable, so every save uses a unique key and the
      # restore picks the most recent one via the prefix in restore-keys.
      - name: Restore version cache
        uses: actions/cache/restore@v5
        with:
          path: versions.txt
          key: caddy-versions-${{ github.run_id }}
          restore-keys: |
            caddy-versions-

      - name: Check for new base image or plugin versions
        id: check-versions
        run: |
          set -euo pipefail

          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }

          echo "--> Fetching current dependency versions..."
          CURRENT_CADDY_DIGEST=$(digest caddy:latest)
          CURRENT_BUILDER_DIGEST=$(digest caddy:builder)
          # Ask the Go module proxy: this is exactly what xcaddy/go resolves as
          # "latest", and it is not subject to the GitHub API rate limit.
          CURRENT_PLUGIN_VERSION=$(curl -fsSL https://proxy.golang.org/github.com/caddy-dns/cloudflare/@latest | jq -er '.Version')
          echo "Current Caddy Digest:   $CURRENT_CADDY_DIGEST"
          echo "Current Builder Digest: $CURRENT_BUILDER_DIGEST"
          echo "Current Plugin Version: $CURRENT_PLUGIN_VERSION"

          PREVIOUS_CADDY_DIGEST=""
          PREVIOUS_BUILDER_DIGEST=""
          PREVIOUS_PLUGIN_VERSION=""
          if [[ -f versions.txt ]]; then
            source versions.txt
            echo "Previous Caddy Digest:   $PREVIOUS_CADDY_DIGEST"
            echo "Previous Builder Digest: $PREVIOUS_BUILDER_DIGEST"
            echo "Previous Plugin Version: $PREVIOUS_PLUGIN_VERSION"
          else
            echo "--> No previous version cache found."
          fi

          NEEDS_BUILD="false"
          if [[ "$CURRENT_CADDY_DIGEST" != "$PREVIOUS_CADDY_DIGEST" \
             || "$CURRENT_BUILDER_DIGEST" != "$PREVIOUS_BUILDER_DIGEST" \
             || "$CURRENT_PLUGIN_VERSION" != "$PREVIOUS_PLUGIN_VERSION" ]]; then
            echo "--> Dependency changes detected."
            NEEDS_BUILD="true"
          fi
          # A push (Dockerfile/workflow change) or a forced manual run always builds.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.force }}" == "true" ]]; then
            echo "--> Build forced by ${{ github.event_name }} event."
            NEEDS_BUILD="true"
          fi
          [[ "$NEEDS_BUILD" == "false" ]] && echo "--> Dependencies are up-to-date. Build will be skipped."

          {
            echo "PREVIOUS_CADDY_DIGEST=$CURRENT_CADDY_DIGEST"
            echo "PREVIOUS_BUILDER_DIGEST=$CURRENT_BUILDER_DIGEST"
            echo "PREVIOUS_PLUGIN_VERSION=$CURRENT_PLUGIN_VERSION"
          } > versions.txt

          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$CURRENT_PLUGIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check-versions.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        if: steps.check-versions.outputs.needs_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CLOUDFLARE_PLUGIN_VERSION=${{ steps.check-versions.outputs.plugin_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:cf-${{ steps.check-versions.outputs.plugin_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only record the versions once the image was actually pushed.
      - name: Save version cache
        if: steps.check-versions.outputs.needs_build == 'true'
        uses: actions/cache/save@v5
        with:
          path: versions.txt
          key: caddy-versions-${{ github.run_id }}

      - name: Print Skip Message
        if: steps.check-versions.outputs.needs_build == 'false'
        run: echo "✅ Build and push skipped as no dependency updates were found."

      # Re-enabling an already enabled workflow is harmless and keeps GitHub
      # from auto-disabling the schedule when the repo has no commits.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-caddy.yml/enable"
